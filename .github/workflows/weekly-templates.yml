name: Weekly template verification

on:
  pull_request:
  schedule:
    # 07:30 during CET and 08:30 during CEST in Europe/Stockholm.
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-template-verification-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  cli:
    name: CLI scaffolding tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      templates: ${{ steps.template-list.outputs.templates }}
    steps:
      - name: Checkout templates
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
          cache: pnpm
      - name: Install CLI dependencies
        run: pnpm install --frozen-lockfile
      - name: Read template list
        id: template-list
        run: node -e "console.log('templates=' + JSON.stringify(require('./scripts/templates.json')))" >> "$GITHUB_OUTPUT"
      - name: Test CLI scaffolding
        run: pnpm test

  template:
    name: Verify ${{ matrix.template }}
    needs: cli
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.cli.outputs.templates) }}
    steps:
      - name: Checkout templates
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
          cache: pnpm
      - name: Install CLI dependencies
        run: pnpm install --frozen-lockfile
      - name: Build CLI and verify generated project
        run: pnpm build && pnpm test:template ${{ matrix.template }}